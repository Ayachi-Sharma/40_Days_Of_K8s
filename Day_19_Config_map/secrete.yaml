apiVersion: v1
kind: Pod
metadata:
  name: secret
spec:
  containers:
  - name: nginx
    image: nginx
    env:
      - name: onsecrete
        valueFrom:
          secretKeyRef:
            name: onsecrete
            key: first
      - name: second
        valueFrom:
          secretKeyRef:
            name: scndsecrete
            key: second
