apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubernetes-cronjob
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: busybox
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - 'echo "40daysofkubernetes"'
          restartPolicy: OnFailure